# RiVision Node Docker 部署 (K3 RISC-V)
#
# 架构: 单容器 (llama-server + node-agent)
# 每个 K3 节点独立部署，通过 .env 区分配置
#
# ── 构建 K3 (一次性) ──
#   1. K3 上编译 llama.cpp: scripts/build.sh
#   2. cp docker/.env.example docker/.env && vim docker/.env
#   3. docker compose -f docker/docker-compose.node.k3.yml build
#   4. docker save rivision-node:latest | gzip > rivision-node-image.tar.gz
#
# ── 生产 K3 (每台) ──
#   部署只需: 镜像 + .env + docker-compose.yml
#   无需手动创建任何目录或准备外部文件
#   1. docker load < rivision-node-image.tar.gz
#   2. cp docker/.env.example docker/.env && vim docker/.env
#   3. docker compose -f docker/docker-compose.node.k3.yml up -d
#
# ── 镜像内置内容 ──
#   - Python .pyc 字节码 (node-agent)
#   - llama.cpp 预编译二进制
#   - 默认模型 (fastvlm-0.5b-q8)
#   - 默认配置 (models.conf + active-model.sh)
#
# ── 高级: 自定义模型/配置 ──
#   取消下方 volumes 注释即可用外部文件覆盖镜像内置内容
#
# ── 临时覆盖 (调试) ──
#   NODE_ID=k3-test docker compose -f docker/docker-compose.node.k3.yml up

services:

  rivision-node:
    image: rivision-node:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.node.k3
    container_name: rivision-node
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${LLAMA_PORT:-9080}:9080"
      - "${AGENT_PORT:-9090}:9090"
    environment:
      NODE_ID: ${NODE_ID:-}
      GATEWAY_URL: ${GATEWAY_URL:-http://192.168.122.1:8081}
      REGISTRATION_TOKEN: ${REGISTRATION_TOKEN:-}
      NODE_HOST: ${NODE_HOST:-auto}
      NODE_TAGS: ${NODE_TAGS:-riscv,k3,docker}
      AGENT_HOST: "0.0.0.0"
      AGENT_PORT: "9090"
      LLAMA_PORT: "9080"
      LLAMA_THREADS: ${LLAMA_THREADS:-8}
      LLAMA_BATCH_THREADS: ${LLAMA_BATCH_THREADS:-8}
      LLAMA_CPU_AFFINITY: ${LLAMA_CPU_AFFINITY:-}
      LLAMA_CTX_SIZE: ${LLAMA_CTX_SIZE:-4096}
      LLAMA_PARALLEL: ${LLAMA_PARALLEL:-1}
      LLAMA_FLASH_ATTN: ${LLAMA_FLASH_ATTN:-true}
      LLAMA_BUILD_DIR: /app/llama.cpp/build-k3
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_ENABLE: "true"
      LOG_FILE: /app/logs/node-agent.log
      DEFAULT_MODEL: ${DEFAULT_MODEL:-fastvlm-0.5b-q8}
    volumes:
      # 日志持久化 (named volume, 自动管理)
      - node_logs:/app/logs
      # --- 高级用户: 取消注释可覆盖镜像内置的模型/配置 ---
      # 模型覆盖: 挂载包含 .gguf 文件的目录
      # - ${MODELS_DIR:-./models}:/app/models:ro
      # 配置覆盖: 挂载包含 models.conf / active-model.sh 的目录
      # - ${CONFIG_DIR:-./config}:/app/config
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    # K3 性能优化: 绑定大核 (可选)
    # cpuset: "0-7"

volumes:
  node_logs:
