[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=warn

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:llama-server]
command=/app/scripts/start-llama.sh
directory=/app
autostart=true
autorestart=true
priority=10
startsecs=5
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=
    LLAMA_PORT="%(ENV_LLAMA_PORT)s",
    LLAMA_THREADS="%(ENV_LLAMA_THREADS)s",
    LLAMA_BATCH_THREADS="%(ENV_LLAMA_BATCH_THREADS)s",
    LLAMA_CPU_AFFINITY="%(ENV_LLAMA_CPU_AFFINITY)s",
    LLAMA_CTX_SIZE="%(ENV_LLAMA_CTX_SIZE)s",
    LLAMA_PARALLEL="%(ENV_LLAMA_PARALLEL)s",
    LLAMA_FLASH_ATTN="%(ENV_LLAMA_FLASH_ATTN)s",
    LLAMA_BUILD_DIR="%(ENV_LLAMA_BUILD_DIR)s"

[program:node-agent]
command=python -m uvicorn app.main:app --host %(ENV_AGENT_HOST)s --port %(ENV_AGENT_PORT)s --log-level info
directory=/app/node-agent
autostart=true
autorestart=true
priority=20
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=
    NODE_ID="%(ENV_NODE_ID)s",
    GATEWAY_URL="%(ENV_GATEWAY_URL)s",
    REGISTRATION_TOKEN="%(ENV_REGISTRATION_TOKEN)s",
    NODE_HOST="%(ENV_NODE_HOST)s",
    NODE_TAGS="%(ENV_NODE_TAGS)s",
    AGENT_HOST="%(ENV_AGENT_HOST)s",
    AGENT_PORT="%(ENV_AGENT_PORT)s",
    LLAMA_PORT="%(ENV_LLAMA_PORT)s",
    LLAMA_BUILD_DIR="%(ENV_LLAMA_BUILD_DIR)s",
    HEARTBEAT_INTERVAL="%(ENV_HEARTBEAT_INTERVAL)s",
    LOG_LEVEL="%(ENV_LOG_LEVEL)s",
    LOG_ENABLE="%(ENV_LOG_ENABLE)s",
    LOG_FILE="%(ENV_LOG_FILE)s",
    LLAMA_SERVICE_NAME="rivision-llama"
