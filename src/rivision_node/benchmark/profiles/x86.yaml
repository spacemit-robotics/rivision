# Profile: x86
# x86_64 CPU 平台配置

name: x86
platform: amd64
description: "x86_64 CPU (AVX2/AVX512)"

# ================================================
# 编译配置
# ================================================
build:
  toolchain: ""  # 使用系统默认编译器
  cross_compile: false
  c_flags: "-march=native -O3 -ffast-math"
  cxx_flags: "-march=native -O3 -ffast-math"

# ================================================
# YOLO 配置
# ================================================
yolo:
  backend: ort_cpu
  execution_provider: CPUExecutionProvider
  workers: 4
  threads_per_worker: 4
  
  # ONNX Runtime 库路径
  ort_lib: ${PROJECT_ROOT}/yolo-server/third_party/onnxruntime_x86/lib
  ort_include: ${PROJECT_ROOT}/yolo-server/third_party/onnxruntime_x86/include
  
  # ORT 优化
  intra_op_threads: 4
  inter_op_threads: 2
  graph_optimization_level: ORT_ENABLE_ALL
  
  # 模型文件
  model_dir: ${PROJECT_ROOT}/models/shared
  default_model: yolov8n.onnx
  
  # 推理参数
  conf_threshold: 0.25
  nms_threshold: 0.45

# ================================================
# VLM 配置
# ================================================
vlm:
  backend: llama_cpu
  cli: llama-mtmd-cli
  cli_path: ${PROJECT_ROOT}/third_party/llama.cpp/x86_64/build_x86/bin/llama-mtmd-cli
  
  # CPU 配置
  threads: 8
  batch_size: 1
  
  # 推理参数
  context_length: 4096
  max_tokens: 512
  temperature: 0.3
  extra_args: "--cache-type-k q8_0 --cache-type-v q8_0"
  
  # 模型文件
  model_dir: ${PROJECT_ROOT}/models/shared
  default_model: Qwen3VL

# ================================================
# Benchmark 参数
# ================================================
benchmark:
  warmup_runs: 10
  main_runs: 200
  cooldown_sec: 2
  
  # 并发测试级别
  concurrency_levels: [1, 2, 4, 8]
  
  # 压力测试时长 (秒)
  stress_duration_sec: 600
  
  # 资源监控
  monitor_cpu: true
  monitor_memory: true
  monitor_interval_ms: 100

# ================================================
# 预期性能 (参考值)
# ================================================
expected_performance:
  yolo:
    yolov8n:
      fps_min: 100
      fps_max: 150
      latency_ms_max: 12
    yolov8s:
      fps_min: 50
      fps_max: 80
      latency_ms_max: 20
  vlm:
    qwen3vl-4b:
      tokens_per_sec_min: 6
      tokens_per_sec_max: 12
      vision_encode_ms_max: 600
      ttft_ms_max: 800
