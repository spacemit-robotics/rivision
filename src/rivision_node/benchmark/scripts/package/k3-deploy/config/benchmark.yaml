# ============================================================
# RiVision Benchmark 配置文件 (K3 RISC-V)
# ============================================================
# 
# 使用方式:
#   ./rivision-benchmark run --config config/benchmark.yaml
#   ./rivision-benchmark run --config config/benchmark.yaml --profile quick
#
# ============================================================

# 平台配置
platform:
  name: "SpacemiT K1 (K3)"
  arch: "riscv64"
  npu: true
  npu_type: "spacemit"

# ============================================================
# NPU/加速器配置 (K3 A100)
# ============================================================
# K3 有 8 个 A100 智算核 (CPU 8-15)
# SpacemiT EP / llama.cpp 会自动将推理任务调度到 A100 核心
# 无需手动绑定 CPU，底层库自动处理
npu:
  # YOLO (ORT SpacemiT EP) 使用的 A100 核心数
  # 硬件限制: ORT 当前最大支持 4 核
  yolo_threads: 4
  
  # VLM (llama.cpp) 使用的 A100 核心数
  # llama.cpp 支持全部 8 核
  vlm_threads: 8

# ============================================================
# 模型发现配置
# ============================================================
model_discovery:
  # 自动扫描目录中的模型
  auto_scan: true
  
  # YOLO 模型目录
  yolo_dirs:
    - "models/yolo"
    
  # VLM 模型目录  
  vlm_dirs:
    - "models/vlm"
    
  # 自动检测后端规则
  backend_rules:
    # 文件名匹配规则 -> 后端类型
    - pattern: "*910b*.onnx"
      backend: "ort_npu"
    - pattern: "*.q.onnx"
      backend: "ort_npu"
    - pattern: "*.onnx"
      backend: "ort_cpu"
    - pattern: "*.gguf"
      backend: "llama_cpu"

# ============================================================
# YOLO 模型配置 (精确控制)
# ============================================================
yolo:
  # 启用/禁用的模型列表 (可选，不设置则测试所有发现的模型)
  # enabled_models:
  #   - "910byolo11n_b2.q.onnx"
  #   - "yolov8n.onnx"
  
  # 禁用的模型 (排除某些模型)
  # disabled_models:
  #   - "old_model.onnx"
  
  # 模型详细配置 (覆盖自动检测)
  models:
    - name: "yolo11n-npu"
      path: "models/yolo/910byolo11n_b2.q.onnx"
      backend: "ort_npu"
      enabled: true
      description: "YOLOv11 nano - SpacemiT NPU 优化"
      params:
        conf_threshold: 0.25
        nms_threshold: 0.45
      
    - name: "yolov8n-cpu"
      path: "models/yolo/yolov8n.onnx"
      backend: "ort_cpu"
      enabled: true
      description: "YOLOv8 nano - CPU 版本"

  # 默认测试参数
  defaults:
    runs: 100
    warmup: 5
    batch_size: 1
    timeout_ms: 30000

# ============================================================
# VLM 模型配置 (精确控制)
# ============================================================
vlm:
  models:
    - name: "qwen2.5-vl-3b"
      path: "models/vlm/Qwen2.5-VL-3B-Q4_K_M.gguf"
      backend: "llama_cpu"
      enabled: true
      description: "Qwen2.5-VL 3B Q4量化"
      params:
        max_tokens: 256
        temperature: 0.7
        
  # 默认测试参数
  defaults:
    runs: 5
    prompts:
      - "描述这张图片的内容"
      - "这张图片中有什么物体?"
    max_tokens: 256

# ============================================================
# 测试数据配置
# ============================================================
test_data:
  # 图片测试
  images:
    - path: "data/test.jpg"
      description: "默认测试图片"
      enabled: true
      
  # 视频测试  
  videos:
    - path: "data/test.mp4"
      description: "默认测试视频"
      enabled: true
      max_frames: 100
      
  # 默认数据
  default_image: "data/test.jpg"
  default_video: "data/test.mp4"

# ============================================================
# 测试配置文件 (Profiles)
# ============================================================
profiles:
  # 快速测试
  quick:
    description: "快速验证 (少量迭代)"
    yolo:
      runs: 10
      warmup: 2
    vlm:
      runs: 2
      
  # 标准测试
  standard:
    description: "标准测试 (推荐)"
    yolo:
      runs: 100
      warmup: 5
    vlm:
      runs: 5
      
  # 深度测试
  thorough:
    description: "深度测试 (长时间)"
    yolo:
      runs: 500
      warmup: 20
    vlm:
      runs: 20
      
  # 仅 NPU
  npu_only:
    description: "仅测试 NPU 模型"
    yolo:
      runs: 100
      backend_filter: "ort_npu"
      
  # 仅 CPU
  cpu_only:
    description: "仅测试 CPU 模型"
    yolo:
      runs: 100
      backend_filter: "ort_cpu"

# ============================================================
# HTTP 服务器配置
# ============================================================
http_server:
  yolo:
    port: 8080
    default_model: "models/yolo/910byolo11n_b2.q.onnx"
    max_concurrency: 4
    
  vlm:
    port: 8081
    default_model: "models/vlm/Qwen2.5-VL-3B-Q4_K_M.gguf"

# ============================================================
# 输出配置
# ============================================================
output:
  results_dir: "results"
  
  # 输出格式
  formats:
    - json
    - txt
    # - csv
    
  # 报告内容
  report:
    include_system_info: true
    include_model_details: true
    include_histograms: true
    
  # 日志级别: debug, info, warn, error
  log_level: "info"

# ============================================================
# 系统检查配置 (check 命令)
# ============================================================
check:
  # 检查项目
  items:
    - name: "platform"
      description: "平台架构检测"
      enabled: true
      
    - name: "npu"
      description: "NPU 设备检测"
      enabled: true
      
    - name: "libraries"
      description: "依赖库检查"
      enabled: true
      
    - name: "models"
      description: "模型文件检查"
      enabled: true
      
    - name: "test_data"
      description: "测试数据检查"
      enabled: true
