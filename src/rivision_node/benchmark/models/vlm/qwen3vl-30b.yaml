# Qwen3VL-30B 模型配置 (K3 SMT/NPU 模式)

name: qwen3vl-30b
family: qwen3vl
size: "30B"
quantization: Q4_1
description: "Qwen3 Vision-Language 30B 参数模型 - 高精度版本"

# K3 实际模型目录: models/vlm/qwen30b_multimodal_files/
files:
  directory: qwen30b_multimodal_files
  text_model: qwen3vl-30b-text-q4_1.gguf
  vision_model: qwen3_vl_vision.q_replaceneg.onnx
  config: config.json

# 推理参数
inference:
  context_length: 8192
  max_tokens: 1024
  temperature: 0.3
  top_p: 0.9
  top_k: 40
  seed: 42
  repeat_penalty: 1.1
  default_prompt: "详细描述图片内容"
  system_prompt: "你是一个专业的图像分析助手，请准确、详细地描述图片中的所有内容。"

# 平台配置
platform_config:
  x86:
    threads: 16
    batch_size: 1
    cache_type_k: q8_0
    cache_type_v: q8_0
    extra_args: ""
  
  # K3 RISC-V - 30B 模型可运行但速度较慢
  riscv_b:
    threads: 6
    media_backend: smt
    cache_type_k: q8_0
    cache_type_v: q8_0
    extra_args: "--no-warmup"
    warning: "30B 模型内存紧张，建议关闭其他应用"
  
  arm_gpu:
    threads: 4
    n_gpu_layers: -1
    cuda_device: 0
    flash_attention: true
    extra_args: "--flash-attn"

# 兼容性
compatibility:
  supported_platforms: [x86, riscv_b, arm_gpu]
  min_memory_gb: 16
  recommended_memory_gb: 24

# 量化变体
variants:
  Q4_K_M:
    file: Qwen3VL-30B-A3B-Instruct-Q4_K_M.gguf
    size_gb: 18
    description: "4-bit 量化，平衡质量与大小"
  
  Q5_K_M:
    file: Qwen3VL-30B-A3B-Instruct-Q5_K_M.gguf
    size_gb: 22
    description: "5-bit 量化，更高质量"

expected_performance:
  x86:
    tokens_per_sec_min: 3
    tokens_per_sec_max: 6
    vision_encode_ms: 1000
    ttft_ms: 1200
    total_time_sec: 180
  
  arm_gpu:
    tokens_per_sec_min: 25
    tokens_per_sec_max: 40
    vision_encode_ms: 200
    ttft_ms: 300
    total_time_sec: 30
