# FastVLM-0.5B 模型配置 (K3 SMT/NPU 模式)

name: fastvlm-0.5b
family: fastvlm
size: "0.5B"
quantization: Q4_1
description: "FastVLM 0.5B - LlavaQwen2 架构，针对 NPU 优化"

# K3 实际模型目录: models/vlm/fastvlm-mm-0.5b-q4_1/
files:
  directory: fastvlm-mm-0.5b-q4_1
  text_model: fastvlm-text-0.5B-Q4_1.gguf
  vision_model: fastvlm_vision.f16.onnx
  config: config.json

inference:
  context_length: 2048
  max_tokens: 256
  temperature: 0.3
  default_prompt: "Describe the image."

platform_config:
  x86:
    threads: 4
    extra_args: ""
  riscv_b:
    threads: 4
    media_backend: smt
    extra_args: "--no-warmup"
  arm_gpu:
    threads: 2
    n_gpu_layers: -1
    extra_args: ""

compatibility:
  supported_platforms: [x86, riscv_b, arm_gpu]
  preferred_platforms: [riscv_b]  # NPU 优化
  min_memory_gb: 2

expected_performance:
  x86:
    tokens_per_sec_min: 15
    tokens_per_sec_max: 25
    vision_encode_ms: 200
    ttft_ms: 250
  riscv_b:
    tokens_per_sec_min: 10
    tokens_per_sec_max: 15
    vision_encode_ms: 150
    ttft_ms: 200
  arm_gpu:
    tokens_per_sec_min: 80
    tokens_per_sec_max: 120
    vision_encode_ms: 50
    ttft_ms: 70
