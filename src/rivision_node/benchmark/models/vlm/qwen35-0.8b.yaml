# Qwen3.5-0.8B 模型配置 (K3 SMT/NPU 模式)

name: qwen35-0.8b
family: qwen3_5
size: "0.8B"
quantization: Q4_1
description: "Qwen3.5 VL 0.8B - 轻量级视觉语言模型"

# K3 实际模型目录: models/vlm/Qwen3.5-0.8B/
files:
  directory: Qwen3.5-0.8B
  text_model: qwen3_5vl_0.8b-text-q41.gguf
  vision_model: qwen3_5vl_0.8b-vision-384-op23.f16.onnx
  vision_model_alt:
    - qwen3_5vl_0.8b-vision-224-op23.f16.onnx  # 224x224
    - qwen3_5vl_0.8b-vision-768-op23.f16.onnx  # 768x768
  config: config.json
  input_size: 384

inference:
  context_length: 2048
  max_tokens: 256
  temperature: 0.3
  default_prompt: "描述图片内容"

platform_config:
  riscv_b:
    threads: 6
    media_backend: smt
    cache_type_k: q8_0
    cache_type_v: q8_0
    extra_args: "--no-warmup"

compatibility:
  supported_platforms: [riscv_b, x86]
  min_memory_gb: 2

expected_performance:
  riscv_b:
    tokens_per_sec_min: 12
    tokens_per_sec_max: 18
    vision_encode_ms: 100
    ttft_ms: 150
