# MiniCPM-V 4.5 模型配置

name: minicpm-v4.5
family: minicpm
size: "8B"
quantization: Q4_K_M
description: "MiniCPM-V 4.5 - 高效多模态模型，支持多图理解"

# 模型文件 (基于项目中已有的模型)
files:
  model: miniCPM_v4.5/MiniCPM-V-4_5-Q4_K_M.gguf
  mmproj: miniCPM_v4.5/mmproj-model-f16.gguf

# 推理参数
inference:
  context_length: 4096
  max_tokens: 512
  temperature: 0.3
  top_p: 0.9
  top_k: 40
  seed: 42
  repeat_penalty: 1.1
  default_prompt: "描述这张图片的内容"
  system_prompt: "你是一个视觉助手，能够准确理解和描述图片内容。"

# 平台配置
platform_config:
  x86:
    threads: 8
    batch_size: 1
    cache_type_k: q8_0
    cache_type_v: q8_0
    extra_args: ""
  
  riscv_b:
    threads: 6
    batch_size: 1
    media_backend: smt
    cache_type_k: q8_0
    cache_type_v: q8_0
    extra_args: "--no-warmup"
    note: "K3 NPU 加速视觉编码"
  
  arm_gpu:
    threads: 4
    n_gpu_layers: -1
    cuda_device: 0
    flash_attention: true
    extra_args: "--flash-attn"

# 兼容性
compatibility:
  supported_platforms: [x86, riscv_b, arm_gpu]
  min_memory_gb: 8
  recommended_memory_gb: 12

# 量化变体
variants:
  Q4_K_M:
    file: MiniCPM-V-4_5-Q4_K_M.gguf
    size_gb: 5
    description: "4-bit 量化"
  
  Q8_0:
    file: MiniCPM-V-4_5-Q8_0.gguf
    size_gb: 9
    description: "8-bit 量化，更高精度"

# K3 特定配置 (SpacemiT smt 后端)
k3_config:
  # 使用 smt media backend 进行视觉编码加速
  media_backend: smt
  smt_config_dir: "${MODEL_DIR}/MiniCPM-V-4.5"
  # 视觉编码器配置
  vision_encoder:
    use_npu: true
    precision: fp16
  # llama 推理配置
  llama_args:
    - "--no-warmup"
    - "-t 6"
    - "--cache-type-k q8_0"
    - "--cache-type-v q8_0"

expected_performance:
  x86:
    tokens_per_sec_min: 8
    tokens_per_sec_max: 15
    vision_encode_ms: 400
    ttft_ms: 500
    total_time_sec: 40
  
  riscv_b:
    tokens_per_sec_min: 5
    tokens_per_sec_max: 8
    vision_encode_ms: 300
    ttft_ms: 400
    total_time_sec: 70
    note: "smt 后端加速视觉编码"
  
  arm_gpu:
    tokens_per_sec_min: 50
    tokens_per_sec_max: 80
    vision_encode_ms: 80
    ttft_ms: 100
    total_time_sec: 8
