# YOLOv5s 模型配置

name: yolov5s
family: yolov5
size: s
description: "YOLOv5 Small - 平衡精度与速度"

input:
  width: 640
  height: 640
  channels: 3
  format: NCHW

inference:
  conf_threshold: 0.25
  nms_threshold: 0.45
  max_detections: 100
  num_classes: 80

platform_models:
  x86:
    file: yolov5s.onnx
    provider: CPUExecutionProvider
  riscv_b:
    file: yolov5s_spacemit.onnx
    provider: SpacemiTNPUExecutionProvider
    fallback: yolov5s.onnx
  arm_gpu:
    file: yolov5s.engine
    provider: TensorRTExecutionProvider
    precision: fp16

expected_performance:
  x86:
    fps_min: 60
    fps_max: 100
    latency_avg_ms: 12
  riscv_b:
    fps_min: 40
    fps_max: 70
    latency_avg_ms: 18
  arm_gpu:
    fps_min: 200
    fps_max: 300
    latency_avg_ms: 4
