# YOLOv11n 模型配置

name: yolov11n
family: yolov11
size: n
description: "YOLOv11 Nano - 最新 YOLO 系列轻量级模型"

input:
  width: 640
  height: 640
  channels: 3
  format: NCHW
  normalize: true

inference:
  conf_threshold: 0.25
  nms_threshold: 0.45
  max_detections: 100
  num_classes: 80

# 平台模型文件
platform_models:
  x86:
    file: yolo11n.onnx
    provider: CPUExecutionProvider
    precision: fp32
  
  riscv_b:
    # K3 NPU 量化版本 (项目中已有 910byolo11n_b2.q.onnx)
    file: 910byolo11n_b2.q.onnx
    provider: SpacemiTNPUExecutionProvider
    precision: int8
    quantized: true
    description: "SpacemiT NPU INT8 量化版本"
    fallback: yolo11n.onnx
  
  arm_gpu:
    file: yolo11n.engine
    provider: TensorRTExecutionProvider
    precision: fp16
    fallback: yolo11n.onnx

# 模型变体
variants:
  default:
    file: yolo11n.onnx
    description: "标准 ONNX 模型"
  
  spacemit_q:
    file: 910byolo11n_b2.q.onnx
    description: "SpacemiT NPU INT8 量化版本 (batch=2)"
    platforms: [riscv_b]
    batch_size: 2
  
  spacemit_fp32:
    file: yolo11n_spacemit.onnx
    description: "SpacemiT NPU FP32 优化版本"
    platforms: [riscv_b]

expected_performance:
  x86:
    fps_min: 90
    fps_max: 140
    latency_avg_ms: 9
  riscv_b:
    fps_min: 60
    fps_max: 100
    latency_avg_ms: 12
    note: "使用 INT8 量化版本可提升 30-50%"
  arm_gpu:
    fps_min: 280
    fps_max: 400
    latency_avg_ms: 3
