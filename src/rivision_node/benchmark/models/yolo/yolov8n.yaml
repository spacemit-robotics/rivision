# YOLOv8n 模型配置

name: yolov8n
family: yolov8
size: n
description: "YOLOv8 Nano - 最小最快的 YOLOv8 模型"

# ================================================
# 输入规格
# ================================================
input:
  width: 640
  height: 640
  channels: 3
  format: NCHW
  normalize: true
  mean: [0, 0, 0]
  std: [255, 255, 255]

# ================================================
# 推理参数
# ================================================
inference:
  conf_threshold: 0.25
  nms_threshold: 0.45
  max_detections: 100
  num_classes: 80

# ================================================
# 平台模型文件
# ================================================
platform_models:
  x86:
    file: yolov8n.onnx
    provider: CPUExecutionProvider
    precision: fp32
  
  riscv_b:
    file: yolov8n.onnx
    provider: SpacemiTNPUExecutionProvider
    precision: fp32
  
  arm_gpu:
    file: yolov8n.engine
    provider: TensorRTExecutionProvider
    precision: fp16
    fallback: yolov8n.onnx

# ================================================
# 预期性能 (参考值)
# ================================================
expected_performance:
  x86:
    fps_min: 100
    fps_max: 150
    latency_avg_ms: 8
    latency_p99_ms: 12
  
  riscv_b:
    fps_min: 60
    fps_max: 100
    latency_avg_ms: 12
    latency_p99_ms: 18
  
  arm_gpu:
    fps_min: 300
    fps_max: 400
    latency_avg_ms: 3
    latency_p99_ms: 5

