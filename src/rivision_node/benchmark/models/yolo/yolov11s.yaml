# YOLOv11s 模型配置

name: yolov11s
family: yolov11
size: s
description: "YOLOv11 Small"

input:
  width: 640
  height: 640
  channels: 3
  format: NCHW

inference:
  conf_threshold: 0.25
  nms_threshold: 0.45
  max_detections: 100
  num_classes: 80

platform_models:
  x86:
    file: yolo11s.onnx
    provider: CPUExecutionProvider
  riscv_b:
    file: yolo11s_spacemit.onnx
    provider: SpacemiTNPUExecutionProvider
    fallback: yolo11s.onnx
  arm_gpu:
    file: yolo11s.engine
    provider: TensorRTExecutionProvider
    precision: fp16

expected_performance:
  x86:
    fps_min: 55
    fps_max: 90
    latency_avg_ms: 14
  riscv_b:
    fps_min: 35
    fps_max: 60
    latency_avg_ms: 22
  arm_gpu:
    fps_min: 180
    fps_max: 280
    latency_avg_ms: 4.5
