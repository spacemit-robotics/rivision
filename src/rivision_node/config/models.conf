# ============================================================
# RiVision 模型配置
# 定义可用模型及其参数
# ============================================================
#
# 格式: MODEL_NAME|MODEL_FILE|MMPROJ_FILE|EXTRA_ARGS|PROMPT
#   EXTRA_ARGS 和 PROMPT 中的空格用 \x20 替代
#   PROMPT 留空则使用 test.sh 默认 prompt
#
# 启动模式:
#   - mmproj 模式 (CPU): MMPROJ_FILE 非空时使用 --mmproj 参数
#   - smt 模式 (NPU):    MMPROJ_FILE 为 "smt" 时使用 --media-backend smt --smt-config-dir
#     smt 模式要求模型目录下有 config.json + .gguf + .onnx

# FastVLM 0.5B - 简洁快速模式
fastvlm-0.5b-q4|fastvlm-0.5b-q4_k_m.gguf|fastvlm-0.5b-mmproj-f16.gguf|--jinja|简要描述图片内容
# ★ 推荐默认: Q8_0 + Repack + KV Q8_0, eval 26.4tok/s (+26%), PE 21.9tok/s (+13%)
fastvlm-0.5b-q8|fastvlm-0.5b-q8/fastvlm-0.5b-q8_0.gguf|fastvlm-0.5b-q8/fastvlm-0.5b-mmproj-f16.gguf|--jinja\x20--cache-type-k\x20q8_0\x20--cache-type-v\x20q8_0|简要描述图片内容

# FastVLM 1.5B (更高精度, 速度较慢) - 简洁快速模式
fastvlm-1.5b-q4|fastvlm-1.5b-q4_k_m.gguf|fastvlm-1.5b-mmproj-f16.gguf|--jinja|简要描述图片内容
fastvlm-1.5b-q8|fastvlm-1.5b-q8_0.gguf|fastvlm-1.5b-mmproj-f16.gguf|--jinja\x20--cache-type-k\x20q8_0\x20--cache-type-v\x20q8_0|简要描述图片内容

# FastVLM 7B (最高精度, 需要大内存) - 简洁快速模式
fastvlm-7b-q4|fastvlm-7b-q4_k_m.gguf|fastvlm-7b-mmproj-f16.gguf|--jinja\x20--repeat-penalty\x201.3|简要描述图片内容

# FastVLM-MM 0.5B Q4_1 (NPU/SMT 模式, riscv_b 专用)
# smt 模式: 模型目录下需有 config.json + .gguf + .onnx
fastvlm-mm-0.5b-q4_1|fastvlm-mm-0.5b-q4_1/fastvlm-text-0.5B-Q4_1.gguf|smt|--jinja|简要描述图片内容

# MiniCPM-V 4.5 (OpenBMB, 通用多模态) - 高级详细分析模式
# --cache-type-k/v q8_0: KV cache 从 F16→Q8_0, 省 ~25% 内存带宽
minicpm-v4.5-q4|miniCPM_v4.5/MiniCPM-V-4_5-Q4_K_M.gguf|miniCPM_v4.5/mmproj-model-f16.gguf|--cache-type-k\x20q8_0\x20--cache-type-v\x20q8_0|请详细分析这张照片，包括：1)场景和环境；2)主要人物或物体及其特征；3)人物行为和动态；4)背景细节；5)整体氛围和推断。请给出完整详细的描述。

# ★ Qwen3VL 4B (默认推荐) - 平衡性能与精度
# Q4_K_M 量化，~2.5GB，推理速度较快
Qwen3VL|Qwen3VL/Qwen3VL-4B-Instruct-Q4_K_M.gguf|Qwen3VL/mmproj-Qwen3VL-4B-Instruct-F16.gguf|--cache-type-k\x20q8_0\x20--cache-type-v\x20q8_0|简要描述图片内容
