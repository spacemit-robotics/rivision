# ============================================================
# RiVision YOLO 模型配置
# 定义可用的 YOLO 模型及其参数
# ============================================================

# 格式: MODEL_NAME|MODEL_FILE|INPUT_SIZE|CONF_THRESH|NMS_THRESH|DESCRIPTION
# 
# 参数说明:
#   MODEL_NAME   - 模型简称 (用于 switch-yolo-model.sh)
#   MODEL_FILE   - 模型文件名 (位于 models/ 目录)
#   INPUT_SIZE   - 输入尺寸 (默认 640)
#   CONF_THRESH  - 置信度阈值 (默认 0.5)
#   NMS_THRESH   - NMS 阈值 (默认 0.45)
#   DESCRIPTION  - 模型描述

# ============================================================
# YOLOv8 系列 (Ultralytics)
# ============================================================
# YOLOv8n - Nano 版本，最快速度
yolov8n|yolov8n.onnx|640|0.5|0.45|YOLOv8 Nano - 快速轻量
# YOLOv8s - Small 版本
yolov8s|yolov8s.onnx|640|0.5|0.45|YOLOv8 Small - 平衡速度和精度
# YOLOv8m - Medium 版本
yolov8m|yolov8m.onnx|640|0.5|0.45|YOLOv8 Medium - 中等精度
# YOLOv8l - Large 版本
yolov8l|yolov8l.onnx|640|0.5|0.45|YOLOv8 Large - 高精度
# YOLOv8x - Extra Large 版本
yolov8x|yolov8x.onnx|640|0.5|0.45|YOLOv8 XLarge - 最高精度

# ============================================================
# YOLO11 系列 (Ultralytics 最新)
# ============================================================
# YOLO11n - Nano 版本
yolo11n|yolo11n.onnx|640|0.5|0.45|YOLO11 Nano - 最新架构快速版
# YOLO11s - Small 版本
yolo11s|yolo11s.onnx|640|0.5|0.45|YOLO11 Small - 最新架构小型版
# YOLO11m - Medium 版本
yolo11m|yolo11m.onnx|640|0.5|0.45|YOLO11 Medium - 最新架构中型版
# YOLO11l - Large 版本
yolo11l|yolo11l.onnx|640|0.5|0.45|YOLO11 Large - 最新架构大型版
# YOLO11x - Extra Large 版本
yolo11x|yolo11x.onnx|640|0.5|0.45|YOLO11 XLarge - 最新架构最大版

# ============================================================
# 自定义模型 (按需添加)
# ============================================================
# 示例: 自定义训练的模型
# custom-model|custom.onnx|640|0.6|0.5|自定义训练模型

# ============================================================
# SpacemiT K3 优化模型 (推荐)
# ============================================================
# YOLO11n batch=2 量化版 - SpacemiT NPU 加速，K3 推荐默认模型
yolo11n-k3|910byolo11n_b2.q.onnx|640|0.25|0.45|YOLO11n K3量化版 - SpacemiT NPU加速 (推荐)
